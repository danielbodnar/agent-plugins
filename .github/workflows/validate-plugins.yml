name: Validate Plugins

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'plugins/**/.claude-plugin/**'
      - 'plugins/**/agents/**'
      - 'plugins/**/skills/**'
      - 'plugins/**/commands/**'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Validate marketplace.json is valid JSON
        run: |
          python3 -c "
          import json, sys
          with open('.claude-plugin/marketplace.json') as f:
              d = json.load(f)
          plugins = d.get('plugins', [])
          errors = []
          for p in plugins:
              name = p.get('name')
              if not name:
                  errors.append(f'Plugin missing name: {p}')
              if not p.get('description'):
                  errors.append(f'Plugin {name!r} missing description')
              if not p.get('source'):
                  errors.append(f'Plugin {name!r} missing source')
          if errors:
              print('Validation errors:')
              for e in errors:
                  print(' -', e)
              sys.exit(1)
          print(f'OK: {len(plugins)} plugins validated')
          "
