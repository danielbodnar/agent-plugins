name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for Dependabot PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            author="$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")"
            if [[ "$author" != "dependabot[bot]" ]]; then
              echo "Not a Dependabot PR; skipping."
              exit 0
            fi
            prs="$(jq -cn --argjson number "$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")" '[{number: $number}]')"
          else
            prs="$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '[.[] | select(.user.login == "dependabot[bot]") | {number}]')"
          fi

          if [[ "$(jq 'length' <<<"$prs")" -eq 0 ]]; then
            echo "No open Dependabot PRs to process."
            exit 0
          fi

          jq -r '.[].number' <<<"$prs" | while read -r number; do
            draft="$(gh api "repos/$REPO/pulls/$number" --jq '.draft')"
            if [[ "$draft" == "true" ]]; then
              echo "Skipping draft Dependabot PR #$number"
              continue
            fi

            echo "Enabling auto-merge for #$number"
            if ! gh pr merge "$number" --repo "$REPO" --auto --squash; then
              echo "::warning::Failed to enable auto-merge for #$number"
            fi
          done
